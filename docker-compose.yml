name: gift-ledger

services:
  app:
    image: ghcr.io/945967063/gift-ledger-h5:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: gift-ledger-app
    init: true
    ports:
      - '127.0.0.1:${HOST_PORT:-8090}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DIR: /app/data
      FRONTEND_DIR: /app/public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random value of at least 32 characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-100}
    volumes:
      - gift_ledger_data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  gift_ledger_data:
    name: gift_ledger_sqlite_data
