name: gift-ledger

services:
  # ── 后端 Node.js API 服务 ────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: gift-ledger-backend
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_DIR: /app/data
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a random value of at least 32 characters}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-100}
    volumes:
      # SQLite 数据库持久化
      - gift_ledger_data:/app/data
    networks:
      - gift-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 前端 Nginx 服务 ──────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gift-ledger-frontend
    init: true
    ports:
      - '${HOST_PORT:-80}:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gift-net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  gift_ledger_data:
    name: gift_ledger_sqlite_data

networks:
  gift-net:
    name: gift-ledger-network
    driver: bridge
